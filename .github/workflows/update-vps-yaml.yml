name: 自动更新 ACL4SSR 规则

on:
  schedule:
    - cron: '0 20 * * *'   # 每天 UTC 20:00（北京时间凌晨 4 点）跑一次，可自行调整
  workflow_dispatch: {}     # 也支持手动点击运行

permissions:
  contents: write   # 明确给 GITHUB_TOKEN 写权限，否则 git push 会被 403 拒绝

jobs:
  update:
    runs-on: ubuntu-latest   # 如果走 Cloudflare Worker 代理这条路，改回云端 Runner，不用自建
    steps:
      - uses: actions/checkout@v4   # 不传 ref，默认检出 main（仓库默认分支）

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 安装依赖
        run: pip install requests pyyaml

      - name: 拉取最新规则并生成 vps.yaml
        run: python3 update_config.py

      - name: 发布/更新到 Releases（固定链接，供客户端订阅）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest                # 固定 tag，每次都覆盖同一个 release，下载链接不会变
          name: 最新配置 (自动更新)
          body: |
            由 GitHub Actions 自动生成，跟随 ACL4SSR 官方规则每日同步。
            最后更新时间（UTC）：${{ github.event.repository.updated_at }}
          files: vps.yaml
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
