name: 自动更新 ACL4SSR 规则

on:
  schedule:
    - cron: '0 20 * * *'   # 每天 UTC 20:00（北京时间凌晨 4 点）跑一次，可自行调整
  workflow_dispatch: {}     # 也支持手动点击运行

env:
  TARGET_BRANCH: test/acl4ssr-auto-update   # ← 想操作/提交到哪个分支，改这一行就行

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}   # 明确指定要检出的分支

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 安装依赖
        run: pip install requests pyyaml

      - name: 拉取最新规则并生成 vps.yaml
        run: python3 update_config.py

      - name: 提交变更（如果有）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vps.yaml
          git diff --cached --quiet || git commit -m "chore: 自动同步 ACL4SSR 规则 $(date -u +%Y-%m-%d)"
          git push origin HEAD:${{ env.TARGET_BRANCH }}   # 明确指定要推送的分支